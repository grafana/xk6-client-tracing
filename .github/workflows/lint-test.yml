name: Lint and Test

on: pull_request

permissions: {}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set-up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Format
        run: make check-fmt

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          args: --config ./golangci.yml

      - name: Test
        run: make test
